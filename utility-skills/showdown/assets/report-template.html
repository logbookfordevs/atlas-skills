<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
@font-face { font-family: "Bungee"; src: url({{FONT_BUNGEE}}) format("woff2"); font-display: swap; }
@font-face { font-family: "Atkinson"; src: url({{FONT_ATK400}}) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Atkinson"; src: url({{FONT_ATK700}}) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "JB Mono"; src: url({{FONT_JB400}}) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JB Mono"; src: url({{FONT_JB700}}) format("woff2"); font-weight: 700; font-display: swap; }

/* Single theme on purpose: an arcade cabinet screen. */
:root {
  --cab: #120e1a;
  --bezel: #1c1628;
  --bezel-2: #251d35;
  --rule: #3a3150;
  --ink: #f3eefc;
  --dust: #b7adcc;
  --p1: {{P1_COLOR}};
  --p1-deep: {{P1_DEEP}};
  --p2: {{P2_COLOR}};
  --p2-deep: {{P2_DEEP}};
  --ko: #ff5470;
  --draw: #c9c1dc;
  --display: "Bungee", Impact, sans-serif;
  --body: "Atkinson", ui-sans-serif, system-ui, sans-serif;
  --mono: "JB Mono", ui-monospace, monospace;
  --gap: clamp(16px, 2.5vw, 28px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--cab); }
body { margin: 0; background: var(--cab); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
a { color: var(--p2); text-underline-offset: 3px; }
code, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
code { font-size: .82em; color: var(--dust); background: var(--bezel-2); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--p2); outline-offset: 3px; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; text-wrap: pretty; }
.p1 { color: var(--p1); } .p2 { color: var(--p2); } .dim { color: var(--dust); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--ink); color: var(--cab); padding: 8px 14px; z-index: 100; font-weight: 700; }
.skip:focus { top: 12px; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }

/* HUD */
.hud { position: sticky; top: 0; z-index: 40; background: linear-gradient(var(--cab) 70%, transparent); padding: 12px 0 18px; }
.hud-inner { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.fighter-bar { display: grid; gap: 4px; }
.fighter-bar .name { font: 14px/1 var(--display); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
.fighter-bar.right .name { flex-direction: row-reverse; }
.bar { position: relative; height: 18px; background: #000; border: 2px solid var(--ink); transform: skewX(-14deg); overflow: hidden; }
.right .bar { transform: skewX(14deg); }
.bar i { position: absolute; inset: 0; transform-origin: left; }
.right .bar i { transform-origin: right; }
.bar .trail { background: var(--ko); }
.bar .fill { background: linear-gradient(180deg, color-mix(in oklab, var(--c) 70%, white), var(--c) 55%, color-mix(in oklab, var(--c) 70%, black)); }
.left .bar { --c: var(--p1); } .right .bar { --c: var(--p2); }
.bar i { transform: scaleX(var(--hp, 1)); transition: transform 600ms cubic-bezier(.2,.8,.2,1); }
.bar .trail { transition-delay: 450ms; transition-duration: 900ms; }
.hp-num { font: 700 13px/1 var(--mono); color: var(--dust); }
.timer { font: 22px/1 var(--display); min-width: 92px; text-align: center; padding: 8px 10px; border: 2px solid var(--rule); background: var(--bezel); }
.timer small { display: block; font: 700 10px/1.2 var(--mono); color: var(--dust); letter-spacing: .12em; margin-top: 4px; }

/* Title */
.title { padding: clamp(28px, 6vw, 72px) 0 var(--gap); display: grid; gap: var(--gap); }
.eyebrow-free { font: 700 13px/1.4 var(--mono); color: var(--dust); letter-spacing: .08em; text-transform: uppercase; }
.versus { font: clamp(40px, 8.5vw, 112px)/.92 var(--display); letter-spacing: -.01em; display: flex; flex-wrap: wrap; align-items: baseline; gap: .15em .3em; }
.versus .x { font-size: .5em; color: var(--ko); }
.versus .p1 { text-shadow: 4px 4px 0 var(--p1-deep); } .versus .p2 { text-shadow: 4px 4px 0 var(--p2-deep); }
.lede { max-width: 64ch; font-size: 18px; color: var(--dust); }
.lede b { color: var(--ink); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--gap); }
.card { background: var(--bezel); border: 2px solid var(--rule); padding: 20px; display: grid; gap: 10px; align-content: start; }
.card.c1 { border-color: var(--p1-deep); } .card.c2 { border-color: var(--p2-deep); }
.card h2 { font: 24px/1.1 var(--display); }
.card dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 15px; }
.card dt { color: var(--dust); font-family: var(--mono); font-size: 13px; padding-top: 2px; }
.card dd { margin: 0; }

/* Verdict up front */
.upfront { border: 2px solid var(--ink); background: var(--bezel); padding: clamp(18px, 3vw, 32px); display: grid; gap: 16px; }
.upfront h2 { font: clamp(22px, 3vw, 32px)/1.1 var(--display); }
.tally { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tally div { background: var(--cab); border: 1px solid var(--rule); padding: 14px; display: grid; gap: 4px; }
.tally b { font: 34px/1 var(--display); }
.tally span { font-size: 14px; color: var(--dust); }
.upfront ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 80ch; }

/* Sections */
section.block { padding: clamp(36px, 6vw, 72px) 0 0; display: grid; gap: 18px; }
.block > h2, .round-head h2 { font: clamp(26px, 4vw, 44px)/1.05 var(--display); }
.block > p { max-width: 70ch; color: var(--dust); }
.pipeline { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; counter-reset: step; }
.pipeline li { list-style: none; background: var(--bezel); border-top: 3px solid var(--p2); padding: 14px; font-size: 15px; display: grid; gap: 6px; }
.pipeline li b { font: 12px/1.2 var(--mono); color: var(--dust); letter-spacing: .06em; text-transform: uppercase; }
.pipeline { padding: 0; margin: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap); }
.panel { background: var(--bezel); border: 1px solid var(--rule); padding: 18px; display: grid; gap: 10px; align-content: start; }
.panel h3 { font: 18px/1.2 var(--display); }
.panel ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 15px; }
.stage-shots { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }

/* Rounds */
.round { margin-top: clamp(40px, 7vw, 88px); border: 2px solid var(--rule); background: var(--bezel); scroll-margin-top: 90px; }
.round-head { padding: 18px 22px; border-bottom: 2px solid var(--rule); display: grid; gap: 4px; background: linear-gradient(90deg, color-mix(in oklab, var(--p1) 12%, var(--bezel)), var(--bezel) 40% 60%, color-mix(in oklab, var(--p2) 12%, var(--bezel))); }
.round-no { font: 700 13px/1 var(--mono); color: var(--ko); letter-spacing: .14em; text-transform: uppercase; }
.round-sub { color: var(--dust); font-size: 15px; }
.round-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.col { padding: 20px 22px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.col + .col { border-left: 2px solid var(--rule); }
.col h3 { font: 700 12px/1 var(--mono); color: var(--dust); letter-spacing: .14em; text-transform: uppercase; }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
.shot { margin: 0; display: grid; gap: 6px; }
.shot img { width: 100%; height: auto; display: block; border: 2px solid var(--rule); background: #000; }
.shot.p1b img { border-color: var(--p1-deep); } .shot.p2b img { border-color: var(--p2-deep); }
.shot figcaption { font: 12px/1.3 var(--mono); color: var(--dust); }
.shot a { display: block; }
.facts { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 15px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { font: 700 12px/1.2 var(--mono); color: var(--dust); text-transform: uppercase; letter-spacing: .06em; }
td.num { text-align: right; font-weight: 700; }
.scores { max-width: 420px; }
.scores tbody th { font-weight: 400; }
.why { font-size: 16px; }
.rulecols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.rulecols h4 { font: 700 13px/1.2 var(--body); margin-bottom: 6px; }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.rules li { padding-left: 10px; border-left: 3px solid var(--rule); }
.rules.p1 li { border-color: var(--p1-deep); } .rules.p2 li { border-color: var(--p2-deep); }
.rules code { display: block; margin-top: 3px; width: fit-content; max-width: 100%; }
.eff { font: 700 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 5px; border: 1px solid var(--rule); color: var(--dust); }
.eff-hurt .eff { color: var(--ko); border-color: var(--ko); }
.depth, .variance { font-size: 14px; color: var(--dust); }
.tag { font: 700 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--ink); margin-right: 6px; }
.verdict { display: flex; gap: 22px; align-items: center; padding: 18px 22px; border-top: 2px solid var(--rule); background: var(--cab); flex-wrap: wrap; }
.stamp { font: clamp(34px, 5vw, 56px)/1 var(--display); padding: 6px 14px; border: 4px solid currentColor; transform: rotate(-6deg); }
.stamp.p1s { color: var(--p1); } .stamp.p2s { color: var(--p2); } .stamp.draw { color: var(--draw); }
.verdict-text { display: grid; gap: 4px; flex: 1 1 280px; }
.winner { font-size: 18px; } .winner strong { font-family: var(--display); font-weight: 400; letter-spacing: .02em; }
.conf { font: 700 12px/1 var(--mono); color: var(--dust); margin-left: 8px; text-transform: uppercase; }
.ko-line { font: 15px/1.3 var(--display); color: var(--ko); letter-spacing: .02em; }
.dmg { font: 12px/1.4 var(--mono); }

.js .round .stamp { opacity: 0; transform: rotate(-6deg) scale(1.8); }
.js .round.seen .stamp { opacity: 1; transform: rotate(-6deg) scale(1); transition: transform 380ms cubic-bezier(.3,1.6,.5,1), opacity 160ms linear; }

/* Bonus */
.bonus { margin-top: clamp(40px, 7vw, 88px); border: 2px dashed var(--ko); background: var(--bezel); }
.bonus .round-head { background: var(--bezel); }
.forfeit { display: grid; place-items: center; text-align: center; gap: 10px; padding: 26px 14px; border: 2px solid var(--rule); background: var(--cab); }
.forfeit b { font: clamp(26px, 4vw, 40px)/1 var(--display); color: var(--p1); }
blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--p1-deep); color: var(--dust); font-size: 15px; }

/* Scorecard */
.final { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--gap); align-items: stretch; }
.final .big { font: clamp(44px, 7vw, 80px)/1 var(--display); }
.final .panel { gap: 6px; }

.zoom { all: unset; display: block; cursor: zoom-in; }
.zoom:focus-visible { outline: 3px solid var(--p2); outline-offset: 3px; }
dialog.viewer { padding: 0; border: 2px solid var(--ink); background: var(--cab); color: var(--ink); max-width: min(1400px, 96vw); max-height: 94vh; }
dialog.viewer::backdrop { background: rgba(8, 6, 12, .86); }
dialog.viewer img { display: block; max-width: 100%; max-height: calc(94vh - 52px); width: auto; margin: 0 auto; }
dialog.viewer .bar2 { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; font: 13px/1.3 var(--mono); color: var(--dust); }
dialog.viewer button { font: 700 13px/1 var(--mono); background: var(--ink); color: var(--cab); border: 0; padding: 8px 12px; cursor: pointer; }
footer.end { padding: 64px 0 80px; color: var(--dust); font-size: 14px; }

@media (max-width: 820px) {
  .round-grid { grid-template-columns: 1fr; }
  .col + .col { border-left: 0; border-top: 2px solid var(--rule); }
  .rulecols { grid-template-columns: 1fr; }
  .hud-inner { grid-template-columns: 1fr auto 1fr; gap: 8px; }
  .fighter-bar .name { font-size: 11px; }
  .timer { min-width: 64px; font-size: 16px; padding: 6px; }
}
@media (max-width: 480px) { .shots { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .bar i, .js .round.seen .stamp { transition: none !important; }
  .js .round .stamp { opacity: 1; transform: rotate(-6deg); }
}
</style>
</head>
<body>
<a class="skip" href="#rounds">Skip to the rounds</a>

<div class="hud" role="region" aria-label="Scoreboard">
  <div class="wrap hud-inner">
    <div class="fighter-bar left">
      <div class="name"><span class="p1">{{P1_NAME}}</span><span class="hp-num" id="hp-p1-num">100</span></div>
      <div class="bar" aria-hidden="true"><i class="trail" id="trail-p1"></i><i class="fill" id="fill-p1"></i></div>
    </div>
    <div class="timer" id="timer" aria-live="polite">READY<small>{{ROUND_COUNT}} rounds</small></div>
    <div class="fighter-bar right">
      <div class="name"><span class="p2">{{P2_NAME}}</span><span class="hp-num" id="hp-p2-num">100</span></div>
      <div class="bar" aria-hidden="true"><i class="trail" id="trail-p2"></i><i class="fill" id="fill-p2"></i></div>
    </div>
  </div>
</div>

<main class="wrap">
{{BODY}}
</main>

<footer class="end wrap">
  <p>{{FOOTER}}</p>
</footer>

<dialog class="viewer" id="viewer" aria-label="Screenshot viewer"><div class="bar2"><span id="viewer-cap"></span><button type="button" id="viewer-close">Close</button></div><img id="viewer-img" alt=""></dialog>
<script>
document.documentElement.classList.add("js");
(() => {
  const set = (who, hp) => {
    const v = Math.max(0, hp) / 100;
    document.getElementById("fill-" + who).style.setProperty("--hp", v);
    document.getElementById("trail-" + who).style.setProperty("--hp", v);
    document.getElementById("hp-" + who + "-num").textContent = Math.round(hp);
  };
  const timer = document.getElementById("timer");
  const rounds = [...document.querySelectorAll(".round[data-round]")];
  let current = 0;
  const show = (n) => {
    if (n === current) return;
    current = n;
    if (n === 0) { set("p1", 100); set("p2", 100); timer.innerHTML = "READY<small>" + rounds.length + " rounds</small>"; return; }
    const r = rounds[n - 1];
    set("p1", +r.dataset.hpP1); set("p2", +r.dataset.hpP2);
    timer.innerHTML = (n === rounds.length ? "FINAL" : "R" + n) + "<small>" + r.querySelector("h2").textContent + "</small>";
  };
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) en.target.classList.add("seen"); });
    let n = 0;
    rounds.forEach((r, i) => { if (r.getBoundingClientRect().top < window.innerHeight * 0.55) n = i + 1; });
    show(n);
  }, { threshold: [0, 0.25, 0.5] });
  rounds.forEach((r) => io.observe(r));
  addEventListener("scroll", () => {
    let n = 0;
    rounds.forEach((r, i) => { if (r.getBoundingClientRect().top < window.innerHeight * 0.55) n = i + 1; });
    show(n);
  }, { passive: true });
})();
(() => {
  const dlg = document.getElementById("viewer"), im = document.getElementById("viewer-img"), cap = document.getElementById("viewer-cap");
  document.querySelectorAll(".shot img").forEach((img) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "zoom";
    b.setAttribute("aria-label", "Enlarge: " + img.alt);
    img.replaceWith(b); b.append(img);
    b.addEventListener("click", () => { im.src = img.src; im.alt = img.alt; cap.textContent = img.closest("figure").querySelector("figcaption")?.textContent || ""; dlg.showModal(); });
  });
  document.getElementById("viewer-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", (ev) => { if (ev.target === dlg) dlg.close(); });
})();
</script>
</body>
</html>
