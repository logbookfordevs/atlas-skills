<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono&display=swap" rel="stylesheet">
<style>
  /* Product tokens come from DESIGN.md (see ../../context/DESK-DESIGN.md). */
  :root { --wall:#14120f; --panel:#1b1815; --raised:#25211d; --seam:#342e28; --screen:#efe9de; --dim:#aba397; --faint:#958c80; --brass:#caa565; --brass-soft:#8c7244; --velvet:#2a1418; --velvet-line:#4b252c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wall); color: var(--screen); font-family: "Geist Mono", monospace; font-size: 13px; }
  button { font: inherit; }
  *:focus { outline: none; }

  /* Bench switcher: NOT part of the product. Lets reviewers flip states. Keep it working. */
  .bench { position: fixed; bottom: 12px; right: 12px; z-index: 99; background: #0b0a09; border: 1px dashed #8fb7c9; padding: 6px; border-radius: 8px; font: 11px/1 system-ui; color: #8fb7c9; display: flex; gap: 4px; align-items: center; }
  .bench button { background: none; border: 1px solid #8fb7c9; color: #8fb7c9; border-radius: 4px; padding: 3px 6px; cursor: pointer; }
  .bench button[aria-pressed=true] { background: #8fb7c9; color: #0b0a09; }

  .band { height: 49px; background: var(--velvet); display: flex; align-items: center; gap: 10px; padding: 0 20px; }
  .band .crumb { color: var(--faint); }
  .band .crumb b { color: var(--screen); }
  .band .icons { margin-left: auto; display: flex; gap: 14px; }
  .band .icons span { cursor: pointer; font-size: 16px; }

  main { padding: 26px 15px; }
  .head { display: flex; align-items: flex-start; gap: 10px; }
  .head h1 { font-size: 28px; font-weight: 800; margin: 0; text-transform: capitalize; }
  .head .blurb { color: #6b645a; font-size: 11px; margin-top: 4px; }
  .head .actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 10px; padding: 2px 6px; border-radius: 3px; }
  .pill.on { background: #19c37d; color: #fff; }
  .pill.off { background: #ff3b3b; color: #fff; }
  .btn { background: var(--brass); color: var(--wall); border: 0; border-radius: 4px; padding: 5px 9px; cursor: pointer; font-weight: 700; transition: all .4s; }
  .btn:hover { transform: scale(1.1); }
  .btn.red { background: #ff3b3b; color: #fff; }

  .rooms { display: grid; grid-template-columns: repeat(4, 240px); gap: 7px; margin-top: 30px; }
  .room { background: var(--panel); border: 1px solid var(--seam); border-radius: 16px; padding: 11px; cursor: pointer; transition: all .4s; position: relative; }
  .room:hover { transform: scale(1.1); z-index: 2; }
  .room .t { font-weight: 800; font-size: 14px; }
  .room .n { color: #6b645a; font-size: 11px; }
  .room .dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; }
  .room .inner { margin-top: 8px; border: 1px solid var(--seam); border-radius: 16px; padding: 6px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .box { background: var(--panel); border: 1px solid var(--seam); border-radius: 10px; padding: 9px 17px; }
  .box h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .2em; color: var(--brass); margin: 0 0 10px; }
  .renders li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--seam); opacity: 0; transform: translateX(200px); animation: slide .6s cubic-bezier(.68,-0.55,.27,1.55) forwards; }
  .renders img { width: 72px; height: 40px; object-fit: cover; border-radius: 4px; }
  .renders .size { margin-left: auto; color: #6b645a; }
  @keyframes slide { to { opacity: 1; transform: none; } }
  ul { list-style: none; padding: 0; margin: 0; }

  .ask { display: flex; gap: 6px; margin-top: 10px; }
  .ask input { flex: 1; background: var(--wall); border: 1px solid var(--seam); color: var(--screen); border-radius: 4px; padding: 6px; font: inherit; }

  .spinner-page { position: fixed; inset: 0; display: grid; place-items: center; background: var(--wall); font-size: 18px; }
  .spinner { width: 60px; height: 60px; border: 6px solid var(--seam); border-top-color: var(--brass); border-radius: 50%; animation: spin .3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #ff0000; font-weight: 800; padding: 40px; font-size: 16px; }
  .empty { color: #6b645a; padding: 60px; text-align: center; }
</style>
</head>
<body>
<div class="bench" role="group" aria-label="Bench state switcher">Bench:
  <button data-s="ready">ready</button><button data-s="empty">empty</button><button data-s="loading">loading</button><button data-s="error">error</button>
</div>

<div class="band">
  <span class="crumb">desk / creations / <b>fruit-dreams</b></span>
  <div class="icons"><span onclick="alert('search')">🔍</span><span onclick="alert('tablet')">📱</span><span onclick="alert('settings')">⚙️</span></div>
</div>

<div id="app"></div>

<script>
const DATA = {
  ready: {
    title: "fruit dreams", blurb: "A tiny cat sails a banana. A lemon balloon offers a lift. 30-second loop for Instagram, riso three-ink palette, lullaby track at 72 BPM.",
    claims: { Planned: true, Rendered: true, Checked: false, Reviewed: false, Approved: false },
    rooms: [["Board","24 cards","#19c37d"],["Beats","18 beats · 30 s","#19c37d"],["Asks","2 need you","#ff3b3b"],["Review","3 renders","#19c37d"]],
    renders: [["renders/draft-03.mp4","18.4 MB",1],["renders/draft-02.mp4","17.9 MB",2],["renders/frames/f0120.png","1.2 MB",3],["renders/poster.png","844 KB",4]],
    feedback: [["Checkpoint 2 · motion pass","In Progress"],["Checkpoint 1 · look","Done"]]
  }
};
const state = new URLSearchParams(location.search).get("state") || "ready";

function render(s) {
  const app = document.getElementById("app");
  document.querySelectorAll(".bench button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
  if (s === "loading") { app.innerHTML = '<div class="spinner-page"><div><div class="spinner"></div><p>Loading...</p></div></div>'; return; }
  if (s === "error") { app.innerHTML = '<div class="error">Error: ENOENT: no such file or directory, open \'/Users/leonardo/Creative Room/workspace/creations/fruit-dreams/desk/board.json\' (undefined)</div>'; return; }
  if (s === "empty") { app.innerHTML = '<main><div class="head"><h1>fruit dreams</h1></div><div class="empty">No Data</div></main>'; return; }
  const d = DATA.ready;
  app.innerHTML = `
  <main>
    <div class="head">
      <div><h1>${d.title}</h1><div class="blurb">${d.blurb}</div></div>
      <div class="actions">
        ${Object.entries(d.claims).map(([k,v]) => `<span class="pill ${v?'on':'off'}">${k}</span>`).join("")}
        <button class="btn" onclick="alert('Opening Finder')">Open In Finder</button>
        <button class="btn" onclick="alert('Render started')">Initiate Render Pipeline</button>
        <button class="btn red" onclick="document.getElementById('app').innerHTML='<p class=empty>Piece deleted.</p>'">Delete</button>
      </div>
    </div>
    <div class="rooms">
      ${d.rooms.map(([t,n,c]) => `<div class="room" onclick="alert('${t}')"><span class="dot" style="background:${c}"></span><div class="t">${t}</div><div class="inner"><div class="n">${n}</div></div></div>`).join("")}
    </div>
    <div class="cols">
      <div class="box"><h2>Renders</h2><ul class="renders">
        ${d.renders.map(([p,sz,i],k) => `<li style="animation-delay:${k*300}ms"><img src="img/render-${i}.webp"><span>${p}</span><span class="size">${sz}</span></li>`).join("")}
      </ul></div>
      <div class="box"><h2>Checkpoint Feedback</h2><ul>
        ${d.feedback.map(([t,st]) => `<li style="padding:6px 0;display:flex;justify-content:space-between"><span>${t}</span><span style="color:${st==='Done'?'#19c37d':'#ff3b3b'}">●</span></li>`).join("")}
      </ul>
      <h2 style="margin-top:18px">Ask An Agent</h2>
      <div class="ask"><input placeholder="Type your request here..."><button class="btn">Submit</button></div>
      </div>
    </div>
  </main>`;
}
document.querySelectorAll(".bench button").forEach(b => b.onclick = () => { history.replaceState(null, "", "?state=" + b.dataset.s); render(b.dataset.s); });
render(state);
</script>
</body>
</html>
